name: CI

# Codex CLAUDE-NEXT-STEPS.md section 16.3: the audited tracked-file inventory
# contained no .github/workflows tree at all. This is the bounded workflow
# that section asks for -- typecheck, lint, hermetic tests, build, and a
# fresh-install startup smoke test, all against fixtures/isolated temp
# databases, never against production data or paid services. It must never
# require provider credentials, call a paid data/LLM API, or activate real
# betting; nothing here can promote a model or place a wager.
#
# Third-party Actions are pinned to full commit hashes, not tags, per the
# same section's explicit ask -- a tag can be moved by its publisher, a
# commit hash cannot. Comments record which released version each hash is.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege by default: this workflow only reads the repository and
# reports check results. It never needs to write to the repo, open issues,
# or touch packages/deployments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned. Codex correction C06 asks to "validate the pinned CI Node
          # version and record results": the local development runtime is Node
          # 25, so a suite that only ever runs locally proves nothing about
          # this one.
          node-version: '22'
          cache: 'npm'

      - name: Record the runtime this suite actually ran on
        run: |
          echo "node $(node --version)"
          echo "npm $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails when a surface starts depending on something nothing produces --
      # a page that still renders, using a constant or an empty list, and looks
      # fine. Derived from the source by scripts/wiring-map.mjs; reads no
      # network and no database, so it is hermetic like the rest of this job.
      # Orphans (code that reaches no surface) are reported and deliberately do
      # NOT fail: deleting one is a judgement call, and a gate that fails on
      # judgement calls gets switched off.
      - name: Wiring check
        run: npm run check:wiring

      # Item 58 ACCESSIBILITY PASS: token contrast (WCAG AA, light and dark), the keyboard path
      # through the seven areas, and a scan of every client TSX file for unnamed icon buttons,
      # click-only elements, missing alt, positive tabIndex and unlabeled controls. Files local
      # builders own (Trades client, War Room, Coach, Numbers & People, AI spend) are listed but
      # never fail it. Reads source only: no network, no database, no browser.
      - name: Accessibility check
        run: npm run check:a11y
        env:
          GRIDIRON_A11Y_CHECK: 'enforce'

      - name: Test
        # Every *.test.js file in this repo builds its own isolated temp
        # SQLite database via GRIDIRON_DB_PATH before importing app code
        # (see any test/*.test.js header) and mocks or disables live
        # collectors/schedulers.
        #
        # Codex correction C06: that used to be the whole story, and it was an
        # assertion about the suite rather than a property of the run -- a test
        # that quietly reached a provider would have passed. The guard below
        # ENFORCES it: any fetch to a non-localhost host throws and names the
        # host. Localhost is exempted explicitly, because several tests boot the
        # real server and talk to it over a real socket.
        #
        # GRIDIRON_DB_PATH points somewhere that does not exist, so the two
        # fitted-model suites that need real history report their explicit
        # disposition here instead of silently reading a developer database.
        run: npm test
        env:
          SCHEDULER_DISABLED: '1'
          NODE_OPTIONS: '--import ./test/offline-guard.mjs'
          GRIDIRON_DB_PATH: '${{ runner.temp }}/gridiron-ci-fixture.sqlite'

      - name: Build client
        run: npm run build

      - name: Fresh-install startup smoke test
        # Boots the real server against a brand-new isolated temp SQLite
        # database (never the tracked/live one) and confirms one real
        # endpoint answers -- this is what caught the fresh-install
        # migration-ordering defect fixed earlier in this implementation
        # brief (migrations now run after the port guard, before routes
        # import modules that prepare statements against migrated tables).
        run: npm run start:smoke
        env:
          SCHEDULER_DISABLED: '1'
