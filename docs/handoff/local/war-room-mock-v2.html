<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War Room v2</title>
<!-- War Room v2 mock: one dashboard, no page scroll, Coach drives the UI with typed actions.
     Fake data, team ids only. Self-contained (no external scripts). See WAR-ROOM-UI.md "v2". -->
<style>
:root{
  --bg:#ffffff; --surface:#f6f8fa; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b; --subtle:#94a3b8;
  --accent:#059669; --accent-tint:#ecfdf5; --warn:#b45309; --warn-tint:#fffbeb; --danger:#b91c1c; --danger-tint:#fef2f2;
  --info:#0369a1; --info-tint:#eff6ff; --page:#eef2f5; --shadow:0 1px 2px rgb(15 23 42/.06); --hi:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111917; --surface:#18221f; --line:#26332f; --ink:#e7eeeb; --muted:#9aaba5; --subtle:#6b7c76;
    --accent:#34d399; --accent-tint:#0f2a21; --warn:#f5b454; --warn-tint:#2a1f0c; --danger:#f87171; --danger-tint:#2b1212;
    --info:#7cc4f0; --info-tint:#0c1f2b; --page:#0a100e; --shadow:none; --hi:#5b4a12;
  }
}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#18221f; --line:#26332f; --ink:#e7eeeb; --muted:#9aaba5; --subtle:#6b7c76;
  --accent:#34d399; --accent-tint:#0f2a21; --warn:#f5b454; --warn-tint:#2a1f0c; --danger:#f87171; --danger-tint:#2b1212;
  --info:#7cc4f0; --info-tint:#0c1f2b; --page:#0a100e; --shadow:none; --hi:#5b4a12;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--ink);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
b{font-weight:800}
.grey{color:var(--muted)} .amber{color:var(--warn)} .red{color:var(--danger)} .ink{color:var(--ink)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- desktop grid: exactly one viewport ---------- */
.app{height:100vh;height:100dvh;display:grid;gap:8px;padding:8px;
  grid-template-columns:repeat(4,minmax(0,1fr)) minmax(290px,340px);
  grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) minmax(0,.95fr) 104px}
.deck{display:contents}
.dots{display:none}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;min-height:0;
  display:flex;flex-direction:column;overflow:hidden;position:relative;transition:outline-color .3s}
.panel.big{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.panel.flash{outline:3px solid var(--hi);outline-offset:-1px}
.ph{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);min-height:32px}
.ph h2{margin:0;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .sp{flex:1}
.pb{flex:1;min-height:0;overflow:auto;padding:8px 10px;scrollbar-width:thin}
.xp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.xp:hover{color:var(--ink)}
.pg{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.pg button{border:0;background:none;padding:0 5px;font-size:14px;font-weight:900;color:var(--ink);line-height:1}
.pg button[disabled]{color:var(--subtle);cursor:default}

/* ---------- top strip ---------- */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:0}
.brand{font-weight:900;font-size:14px;white-space:nowrap}
.brand small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:900}
.leagues{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;text-align:left;white-space:nowrap;line-height:1.2}
.lg .n{font-weight:800;font-size:12px}
.lg .w{display:block;font-size:10.5px;color:var(--muted)}
.lg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lg.on .w{color:inherit;opacity:.75}
.lg .rk{display:inline-block;min-width:15px;height:15px;border-radius:50%;background:var(--warn);color:#fff;font-size:10px;font-weight:900;text-align:center;line-height:15px;margin-right:3px}
.lg .rk.low{background:var(--subtle)}
.facts{display:flex;align-items:center;gap:12px;min-width:0;flex:1;overflow:hidden;white-space:nowrap}
.fact .l{display:block;font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-weight:800;font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.chip.allin{background:var(--danger-tint);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.chip.safe{background:var(--info-tint);color:var(--info)}
.mock{font-size:10px;color:var(--muted);border:1px dashed var(--subtle);border-radius:6px;padding:2px 6px;white-space:nowrap}

/* ---------- shared bits ---------- */
.tag{font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 6px;white-space:nowrap;display:inline-block;vertical-align:1px}
.src{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.guess{background:var(--warn-tint);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.prev{color:var(--muted);border:1px dashed var(--subtle)}
.you{background:var(--info-tint);color:var(--info)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#04140e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#04140e}}
.btn.big{padding:9px 16px;font-size:14px}
.btn.sm{padding:2px 7px;font-size:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.dot.grey{background:var(--subtle)} .dot.amber{background:var(--warn)} .dot.red{background:var(--danger)} .dot.green{background:var(--accent)}
.pill{font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.next{border-color:var(--ink);color:var(--ink)}
.pill.run{border-color:var(--info);color:var(--info)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.filt{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:var(--info-tint);color:var(--info);border-radius:999px;padding:1px 4px 1px 8px}
.filt button{border:0;background:none;color:inherit;font-weight:900;padding:0 4px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900;padding:3px 5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td{padding:5px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{list-style:none;margin:0;padding:0}
.list li{padding:5px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.sub2{font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center}

/* ---------- next move deck ---------- */
.mv-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mv-count{font-size:11px;font-weight:900;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--info);font-weight:800;font-size:11.5px;padding:0}
.movecard{touch-action:pan-y;transition:transform .22s ease,opacity .22s ease;will-change:transform}
.movecard.out-left{transform:translateX(-110%) rotate(-3deg);opacity:0}
.movecard.out-right{transform:translateX(110%) rotate(3deg);opacity:0}
.movecard.in{animation:cardin .2s ease}
@keyframes cardin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.who{font-size:20px;font-weight:900;letter-spacing:-.02em;margin:0 0 2px;line-height:1.15}
.gg{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:12.5px;margin:4px 0 6px}
.gg .k{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 6px}
.tile{border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
.tile .l{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;margin:4px 0}
.msg p{margin:3px 0 0;font-size:12.5px;line-height:1.45;user-select:all}
.nosend{font-size:10.5px;color:var(--muted);margin-top:3px}
.acts{display:flex;gap:8px;align-items:center;margin:6px 0}
.acts .btn.big{flex:1}
.reasons{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;margin:2px 0 4px;transition:opacity .6s}
.reasons.fade{opacity:0;pointer-events:none}
.reasons button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.chosen{border:1px solid var(--accent);background:var(--accent-tint);border-radius:8px;padding:6px 8px;font-size:12px;margin:4px 0}
.rt td{white-space:nowrap}
.rt tr{cursor:pointer}
.rt tr.sel td{white-space:normal;background:var(--surface)}
.rt td:first-child{width:78px;font-weight:800}
.why{margin:4px 0 0;padding:0;list-style:none;font-size:12px}
.why li{display:grid;grid-template-columns:42px 1fr;gap:6px;padding:2px 0}
.why .d{font-weight:900;text-align:right}
.hl{background:var(--hi);border-radius:4px}
.cap{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- other panels ---------- */
.stops li{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}
.stops .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--surface);border:1px solid var(--line)}
.stops li.next .n{background:var(--ink);color:var(--bg)}
.stops .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip .top1{display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.echk{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.echk div{display:flex;gap:5px;align-items:center;font-size:11.5px;white-space:nowrap;overflow:hidden}
.echk .id{font-weight:900;color:var(--muted);width:20px}
.big .echk{grid-template-columns:1fr}
.health{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:11.5px}
.tray{display:flex;gap:8px;height:100%;align-items:stretch}
.tc{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);position:relative;overflow:hidden}
.tc .t{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.tc .x{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--muted);font-weight:900}
.tc.newc{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.panel[data-p="tray"] .pb{padding:6px 8px}
svg text{fill:var(--muted);font-size:9px}

/* ---------- coach dock ---------- */
.coach{grid-area:coach;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ch .t{font-weight:900;font-size:14px}
.ch .s{font-size:10.5px;color:var(--muted)}
.ch .tog{display:none}
.chat{flex:1;min-height:0;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:92%;padding:6px 9px;border-radius:10px;font-size:12.5px;line-height:1.4}
.m.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:3px}
.m.c{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.m .foot{display:block;margin-top:5px;padding-top:4px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.m .act{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-bottom:3px}
.pending{margin:0 10px;border:1.5px solid var(--warn);background:var(--warn-tint);border-radius:10px;padding:8px 10px;font-size:12px}
.pending h3{margin:0 0 4px;font-size:12.5px}
.pending ul{margin:2px 0 6px;padding-left:16px}
.pending li{margin:1px 0}
.pending .row{display:flex;gap:6px}
.pending .row .btn{flex:1}
.try{padding:6px 10px 0;display:flex;flex-direction:column;gap:3px}
.try .g{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.try .g span{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.try button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px;font-size:11px}
.ask{display:flex;gap:6px;padding:8px 10px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.log{border-top:1px solid var(--line);padding:5px 10px 8px;max-height:132px;overflow:auto}
.log .lh{display:flex;justify-content:space-between;font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.log ol{list-style:none;margin:0;padding:0;font-size:11px}
.log li{display:grid;grid-template-columns:44px auto 1fr;gap:5px;padding:1px 0;color:var(--muted)}
.log li code{font-size:10px;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.log li .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:90vw}
.toast.on{opacity:1}
.hint{font-size:10.5px;color:var(--muted)}

/* ---------- phone: one-screen swipe deck, Coach as bottom sheet ---------- */
@media (max-width:699px){
  .app{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:auto minmax(0,1fr) auto !important;
    grid-template-areas:"top" "deck" "dots" !important;padding:6px 6px 60px;gap:6px}
  .top{flex-wrap:wrap;gap:6px}
  .brand{font-size:13px}
  .leagues{order:3;width:100%;flex:1 1 100%}
  .facts{order:4;flex:1 1 100%;gap:10px;overflow-x:auto;scrollbar-width:none}
  .mock{display:none}
  .deck{display:flex;grid-area:deck;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;gap:8px;position:relative;min-height:0;scrollbar-width:none}
  .deck::-webkit-scrollbar{display:none}
  .deck>.panel{flex:0 0 100%;scroll-snap-align:start;grid-area:auto !important}
  .xp{display:none}
  .dots{display:flex;grid-area:dots;gap:4px;justify-content:center;overflow-x:auto;scrollbar-width:none}
  .dots button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .dots button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .coach{position:fixed;left:0;right:0;bottom:0;height:54px;z-index:40;border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgb(0 0 0/.15);transition:height .22s ease}
  .coach.open{height:76dvh}
  .ch{cursor:pointer;min-height:53px}
  .ch .tog{display:inline-block;margin-left:auto;border:0;background:none;font-size:16px;font-weight:900}
  .coach:not(.open) .chat,.coach:not(.open) .try,.coach:not(.open) .log,.coach:not(.open) .ask,.coach:not(.open) .pending{display:none}
  .coach:not(.open) .ch .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
  .tray{flex-direction:column}
  .who{font-size:18px}
  .tile .v{font-size:15px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top" aria-label="Where we are going"></header>

  <main class="deck" id="deck" aria-label="War Room panels">
    <section class="panel" data-p="next" aria-label="Next move"></section>
    <section class="panel" data-p="stops" aria-label="Stops"></section>
    <section class="panel" data-p="flip" aria-label="Flip map"></section>
    <section class="panel" data-p="targets" aria-label="Suggested targets"></section>
    <section class="panel" data-p="catch" aria-label="Catch-up and speed"></section>
    <section class="panel" data-p="brain" aria-label="Brain check"></section>
    <section class="panel" data-p="tray" aria-label="Your cards"></section>
  </main>
  <nav class="dots" id="dots" aria-label="Panels"></nav>

  <aside class="coach" id="coach" aria-label="Coach">
    <div class="ch" id="coachHead">
      <div><div class="t">Coach</div><div class="s" id="coachSub">Changes this screen for you. Never sends an offer.</div></div>
      <button class="tog" id="coachTog" aria-label="Open or close Coach">&#9650;</button>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div id="pending"></div>
    <div class="try" id="try">
      <div class="g"><span>Change the view</span>
        <button data-say="show flip map league 3">show flip map league 3</button>
        <button data-say="only RBs">only RBs</button>
        <button data-say="pin K. Bell">pin K. Bell</button>
        <button data-say="add a card with my bye weeks">add a card with my bye weeks</button>
        <button data-say="make flip map bigger">make flip map bigger</button>
      </div>
      <div class="g"><span>Change the plan (you confirm)</span>
        <button data-say="go fuck-it mode until week 6">go fuck-it mode until week 6</button>
        <button data-say="get me a TE">get me a TE</button>
        <button data-say="skip this">skip this</button>
        <button data-say="chart my title odds">chart my title odds</button>
        <button data-say="undo">undo</button>
      </div>
    </div>
    <form class="ask" id="ask" autocomplete="off">
      <input id="askIn" placeholder="Ask Coach to change the screen..." aria-label="Ask Coach">
      <button class="btn primary" type="submit">Ask</button>
    </form>
    <div class="log">
      <div class="lh"><span>Action log</span><span id="logN">0</span></div>
      <ol id="log"></ol>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ================= fake engine data (team ids only) ================= */
var POS = {"C. Ruiz":"RB","M. Oduya":"WR","T. Kline":"TE","D. Harlow":"WR","K. Bell":"RB","R. Voss":"TE","A. Brandt":"WR",
  "L. Moreno":"TE","G. Iverson":"WR","E. Park":"RB","B. Lowe":"WR","J. Pike":"RB","S. Achebe":"RB","N. Whitfield":"WR",
  "P. Dorsey":"QB","H. Castillo":"WR","O. Lindqvist":"TE","V. Mensah":"RB","W. Tran":"WR","Q. Adair":"RB","F. Novak":"QB",
  "Y. Banks":"TE","I. Rourke":"WR","Z. Keane":"RB","C. Duval":"QB","M. Okafor":"TE"};

function mv(partner, give, get, p, before, after, walk, reason, extra){
  var o = {partner:partner, give:give, get:get, p:p, before:before, after:after, walk:walk, reason:reason,
    band:(p-10)+"-"+(p+10)+"%", when:"this week",
    msg:"Hey, would you do "+give.join(" + ")+" for "+get.join(" + ")+"? "+reason+" Open to a small tweak if you want one.",
    replies:{accept:"Lock it in. Then the next stop on the route opens.",

var PANEL_RX=[["flip",/flip/],["stops",/\bstops?\b|route|itinerary/],["targets",/target/],["catch",/catch|speed|on time|behind/],["brain",/brain|check|health/],["tray",/cards?\b|pins?\b|tray/],["next",/next move|offer|deal/]];
function panelFrom(t){ for(var i=0;i<PANEL_RX.length;i++) if(PANEL_RX[i][1].test(t)) return PANEL_RX[i][0]; return null; }
var POS_RX=[["TE",/\b(te|tes|tight ?ends?)\b/],["RB",/\b(rb|rbs|running ?backs?)\b/],["WR",/\b(wr|wrs|receivers?|wideouts?)\b/],["QB",/\b(qb|qbs|quarterbacks?)\b/]];
function posFrom(t){ for(var i=0;i<POS_RX.length;i++) if(POS_RX[i][1].test(t)) return POS_RX[i][0]; return null; }
function findPlayer(q){
  q=q.toLowerCase().replace(/[^a-z .]/g,"").trim(); if(!q) return null;
  var names=Object.keys(POS), exact=names.filter(function(n){ return n.toLowerCase()===q; })[0]; if(exact) return exact;
  var last=q.split(/[ .]+/).filter(Boolean).pop();
  return names.filter(function(n){ return n.toLowerCase().split(" ").pop()===last; })[0] || null;
}

function parse(raw){
  var t=raw.toLowerCase().trim(), m;
  if(/^undo\b|take (that|it) back|revert/.test(t)) return {type:"undo"};
  if(/\bsend\b/.test(t) && !/\bsend (me|to)\b.*\b(card|panel)\b/.test(t)) return {type:"refuse_send"};
  if(/^(next(?! move)|skip( this| it)?|another( one)?|show me another|nah|pass)\b/.test(t)) return {type:"deck_next"};
  if(/fuck.?it|all.?in|swing big|yolo/.test(t)){ m=t.match(/week (\d+)|wk ?(\d+)/); return {type:"set_risk_mode", to:"all_in", until:m?+(m[1]||m[2]):null}; }
  if(/safe mode|play it safe|go safe/.test(t)) return {type:"set_risk_mode", to:"safe", until:null};
  if(/balanced mode|go balanced/.test(t)) return {type:"set_risk_mode", to:"balanced", until:null};
  if(/\b(get|find|add) me an? /.test(t) && posFrom(t)) return {type:"add_stop", pos:posFrom(t), forget:/forget|instead|drop|skip the/.test(t)};
  if((m=t.match(/^(?:un)?pin\s+(.+)/))){ return {type:/^unpin/.test(t)?"unpin":"pin_card", q:m[1]}; }
  if(/bye/.test(t)) return {type:"plug_in", kind:"bye"};
  if(/(title|playoff)? ?odds/.test(t) && /(chart|card|graph|plot|by week|track)/.test(t)) return {type:"plug_in", kind:"odds"};
  if(/reset (the )?layout|default layout|put (it|everything) back/.test(t)) return {type:"reset_layout"};
  if(/bigger|larger|more room|blow up/.test(t) && panelFrom(t)) return {type:"arrange_layout", p:panelFrom(t)};
  if(/(only|just) /.test(t) && posFrom(t)) return {type:"filter", pos:posFrom(t)};
  if(/all positions|clear (the )?filter|show everyone|no filter/.test(t)) return {type:"filter", pos:null};
  if(/sort by (chance|yes|p\(yes\)|likely)/.test(t)) return {type:"sort", by:"yes"};
  if(/sort by (gap|gain|value)/.test(t)) return {type:"sort", by:null};
  if(/softer|nicer|friendlier|less pushy/.test(t)) return {type:"draft_message"};
  if(/\bwhy\b|explain/.test(t)) return {type:"explain"};
  m=t.match(/league (\d)/);
  var p=panelFrom(t);
  if(p || m) return {type:"focus_panel", p:p||"next", league:m?+m[1]:null};
  return {type:"unknown"};
}

function run(raw){
  if(!raw.trim()) return;
  say("u",raw);
  var a=parse(raw);
  if(pending && a.type!=="undo"){ log("preview dropped","You asked something else; plan unchanged"); pending=null; }
  apply(a,raw);
}

function apply(a,raw){
  var Lg, p;
  switch(a.type){
    case "undo":
      if(pending){ pending=null; say("c","Dropped the preview. Nothing changed.","cancel"); log("cancel","Preview dropped, plan unchanged"); break; }
      if(!hist.length){ say("c","Nothing to undo yet.","undo"); break; }
      S=JSON.parse(hist.pop()); log("undo","Reverted the last change"); say("c","Undone. The screen is back to how it was.","undo"); break;
    case "refuse_send":
      say("c","I can't send offers, and I never will. Tap Copy on the message, then send it yourself in ESPN.","refused: send");
      log("refused","Send request refused (sending stays your tap)"); flashP="next"; break;
    case "deck_next":
      skip(null,true); return;
    case "focus_panel":
      snap();
      if(a.league && LEAGUES[a.league]) S.league=a.league;
      if(a.league && !LEAGUES[a.league]){ hist.pop(); say("c","There is no League "+a.league+". You have Leagues 1-4.","refused"); break; }
      S.swap = (a.p==="next"||a.p==="tray") ? null : a.p;
      if(a.p==="tray") S.bigPanel=null;
      flashP=a.p; S._goto=a.p;
      log("focus_panel",(a.league?"League "+a.league+", ":"")+PANEL_NAMES[a.p]+(S.swap?" in the big slot":""));
      say("c","Showing "+L().name+"'s "+PANEL_NAMES[a.p].toLowerCase()+(S.swap?" in the big slot. Esc puts it back.":"."),"focus_panel");
      break;
    case "filter":
      snap(); S.filter=a.pos; S.page.flip=0; S.page.targets=0; flashP="flip";
      log("filter",a.pos?"Only "+a.pos+"s in flip map + targets":"Filter cleared");
      say("c",a.pos?"Flip map and targets now show only "+a.pos+"s ("+flipRows().length+" flips, "+targetRows().length+" targets).":"Showing every position again.","filter");
      break;
    case "sort":
      snap(); S.sort=a.by; log("sort",a.by?"Flip map + targets by chance of yes":"Back to engine order");
      say("c",a.by?"Sorted by chance he says yes.":"Back to the engine's order (biggest gap first).","sort"); flashP="flip"; break;
    case "pin_card":
      var n=findPlayer(a.q);
      if(!n){ say("c","I couldn't find \""+a.q+"\". Try a last name, like \"pin Bell\".","refused"); break; }
      if(S.pins.indexOf(n)>=0){ say("c",n+" is already pinned.","pin_card"); break; }
      snap(); S.pins.push(n); newCardId="pin:"+n; flashP="tray"; S.page.tray=99;
      log("pin_card","Pinned "+n); say("c","Pinned "+n+" to Your cards. It stays on screen when you switch panels.","pin_card"); break;
    case "unpin":
      var un=findPlayer(a.q); if(!un||S.pins.indexOf(un)<0){ say("c","That player isn't pinned.","refused"); break; }
      snap(); S.pins=S.pins.filter(function(x){ return x!==un; }); log("unpin","Unpinned "+un); say("c","Unpinned "+un+".","unpin"); break;
    case "plug_in":
      snap(); var id="c"+(++cardSeq);
      S.cards.push({type:"plug",id:id,kind:a.kind,league:S.league}); newCardId=id; flashP="tray"; S.page.tray=99;
      var fld=a.kind==="bye"?"roster.bye_holes":"title.odds_by_week";
      log("plug_in","New card from engine field "+fld+" ("+(a.kind==="bye"?"bar sparkline":"line sparkline")+")");
      say("c","Added a card from the engine field "+fld+". I picked the field and the chart. The numbers come from the engine, not me.","plug_in"); break;
    case "arrange_layout":
      if(a.p==="next"||a.p==="tray"){ say("c",a.p==="next"?"Next move is already the biggest panel.":"Your cards stay in the bottom row. Try \"make flip map bigger\".","arrange_layout"); break; }
      snap(); S.bigPanel=a.p; S.swap=null; flashP=a.p;
      log("arrange_layout",PANEL_NAMES[a.p]+" doubled; next move keeps its size");
      say("c","Made the "+PANEL_NAMES[a.p].toLowerCase()+" bigger. Say \"reset layout\" or \"undo\" to put it back.","arrange_layout"); break;
    case "reset_layout":
      snap(); S.bigPanel=null; S.swap=null; log("reset_layout","Default grid"); say("c","Layout reset to the default grid.","reset_layout"); break;
    case "draft_message":
      snap(); var m0=curMove(); S.soft[S.league]="No pressure at all, just floating an idea: "+m0.give.join(" + ")+" for "+m0.get.join(" + ")+"? Happy to hear what would work for you.";
      S.deck[S.league]=0; log("draft_message","Softer message for "+m0.partner); say("c","Rewrote the message softer. Same deal, same numbers. You still copy and send it.","draft_message"); flashP="next"; break;
    case "explain":
      snap(); S.explain=true; S.swap=null; flashP="next"; log("explain","Reason chain highlighted on next move");
      say("c","Highlighted the reasons on the next move card. Biggest one: "+curMove().why[0][1]+".","explain"); break;
    case "set_risk_mode":
      Lg=L(); p=planOf(S.league);
      var fromM=MODES[p.risk], toM=MODES[a.to], ups={all_in:1.3,safe:-0.6,balanced:0.2}[a.to];
      var missFrom=18, missTo={all_in:29,safe:12,balanced:18}[a.to];
      pending={kind:"risk", a:a, title:"Switch "+Lg.name+" to "+toM+(a.until?" until wk "+a.until:"")+"?",
        lines:["Mode: "+fromM+" &rarr; <b>"+toM+"</b>"+(a.until?" (back to "+fromM+" after wk "+a.until+")":""),
          esc(Lg.unit)+": <b>"+pct(Lg.now)+" &rarr; "+pct(Lg.now+ups)+"</b> expected ("+(ups>=0?"+":"")+ups+")",
          "Chance you miss the playoffs: "+missFrom+"% &rarr; <b>"+missTo+"%</b>",
          a.to==="all_in" ? "Next move changes: <b>"+Lg.alt.partner+", "+Lg.alt.give.join(" + ")+" for "+Lg.alt.get.join(" + ")+"</b>" : "Next move: stays the same",
          a.to==="all_in" ? '<span class="red">E1 has not passed: part of the upside is a guess.</span>' : "Same dice as your current plan"],
        verdict: a.to==="all_in" ? "Close call: more title upside, more downside." : "Lower variance, slightly lower ceiling."};
      log("set_risk_mode","Preview shown; waiting for your confirm");
      say("c","Here's the trade-off first. Nothing changes until you tap Confirm.","set_risk_mode (preview)"); break;
    case "add_stop":
      Lg=L(); p=planOf(S.league);
      var tgt=Lg.targets.filter(function(x){ return x.pos===a.pos; })[0];
      if(!tgt){ var nm=Object.keys(POS).filter(function(n){ return POS[n]===a.pos; })[0]; tgt={n:nm,pos:a.pos,owner:8,gain:1.1,reach:45}; }
      var gain=+(tgt.gain*0.3).toFixed(1), cost=0.4, removeIdx=-1;
      if(a.forget){ removeIdx=Lg.stops.findIndex(function(s,i){ return i>0 && /WR/.test(s.l); }); }
      var refund = removeIdx>=0 ? 0.3 : 0, net=+(gain-cost+refund).toFixed(1);
      pending={kind:"stop", a:a, tgt:tgt, removeIdx:removeIdx, title:"Add a stop: get "+tgt.n+" ("+a.pos+")?",
        lines:["Adds stop 2: <b>Get "+esc(tgt.n)+" ("+a.pos+") from Team "+tgt.owner+"</b> (chance "+tgt.reach+"%)",
          "Costs <b>"+cost+" pts</b> and 1 extra step",
          "Gains <b>"+gain+" pts</b> (covers your "+a.pos+" hole in the playoff weeks)",
          removeIdx>=0 ? "Drops stop: "+esc(Lg.stops[removeIdx].l)+" (+"+refund+" back)" : "Keeps every current stop",
          "Next move: stays the same"],
        verdict:"Net "+(net>=0?"+":"")+net+": "+(net>0.2?"worth it":net<-0.1?"not worth it":"close call")+"."};
      log("add_stop","Preview shown; waiting for your confirm");
      say("c","Here's what adding that stop costs and gains. Nothing changes until you tap Confirm.","add_stop (preview)"); break;
    default:
      say("c","I don't have that action, so I didn't change anything. I can: show a panel, filter, pin, add a card, resize, change the plan (with a preview), skip a move, or undo.","refused: unknown action");
      log("refused","Unknown ask: \""+raw.slice(0,40)+"\"");
  }
  render(); afterRender();
}

function renderPending(){
  var el=document.getElementById("pending");
  if(!pending){ el.innerHTML=""; return; }
  el.innerHTML='<div class="pending" role="dialog" aria-label="Trade-off preview"><h3>'+esc(pending.title)+'</h3><ul>'+pending.lines.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul><div style="font-weight:800;margin-bottom:6px">'+esc(pending.verdict)+'</div><div class="row"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="confirm">Confirm</button></div></div>';
}
function confirmPending(){
  if(!pending) return; var pd=pending; pending=null; snap();
  var p=ensurePlan(S.league);
  if(pd.kind==="risk"){
    p.risk=pd.a.to; p.until=pd.a.until; p.alt=(pd.a.to==="all_in" && LEAGUES[S.league].risk!=="all_in");
    S.deck[S.league]=0; S.skips[S.league]=[]; delete S.chosen[S.league]; S._cardIn=true; flashP="next";
    log("set_risk_mode","Confirmed by you: "+MODES[pd.a.to]+(pd.a.until?" until wk "+pd.a.until:""));
    say("c","Done: "+MODES[pd.a.to]+(pd.a.until?" until week "+pd.a.until:"")+". The next move changed. Say \"undo\" to go back.","set_risk_mode");
  } else {
    p.extra.push({l:"Get "+pd.tgt.n+" ("+pd.tgt.pos+") from Team "+pd.tgt.owner,p:pd.tgt.reach,after:L().now+pd.tgt.gain*0.3,st:"waiting",by:"coach"});
    if(pd.removeIdx>=0) p.removed.push(pd.removeIdx);
    flashP="stops"; log("add_stop","Confirmed by you: +"+pd.tgt.n+(pd.removeIdx>=0?", dropped a WR stop":""));
    say("c","Added "+pd.tgt.n+" as stop 2. Say \"undo\" to take it off.","add_stop");
  }
  render(); afterRender();
}
function cancelPending(){ if(!pending) return; pending=null; log("cancel","You cancelled; plan unchanged"); say("c","Cancelled. Nothing changed.","cancel"); render(); }

/* ================= next-move deck ================= */
function skip(fromEl,viaCoach){
  var ms=movesOf(S.league), i=deckIdx();
  if(i>=ms.length){ if(viaCoach){ say("c","That was the last of the 5. Say \"undo\" to go back one.","deck_next"); render(); } return; }
  var card=document.getElementById("movecard");
  var go=function(){
    snap(); var k=S.league; S.skips[k]=(S.skips[k]||[]).concat([i]); S.deck[k]=i+1; delete S.chosen[k]; S.reply[k]=null; S._cardIn=true;
    var skipped=ms[i]; log("deck_next","Skipped "+skipped.partner+" ("+skipped.get.join(" + ")+")"+(viaCoach?" via Coach":""));
    if(viaCoach) say("c","Skipped. Showing move "+Math.min(i+2,ms.length)+" of "+ms.length+".","deck_next");
    render(); showSkipReasons(skipped); afterRender();
  };
  if(card && isBig("next")){ card.classList.add("out-left"); setTimeout(go,200); } else go();
}
function showSkipReasons(m){
  var row=document.getElementById("skipWhy"); if(!row) return;
  row.innerHTML='<span class="grey">Why skip? (optional)</span>'+["Don't like the player","Costs too much","Don't trust this manager","Not now"].map(function(x){ return '<button data-act="skipreason" data-v="'+esc(x)+'" data-m="'+esc(m.partner+" / "+m.get.join(" + "))+'">'+x+'</button>'; }).join("");
  row.classList.remove("fade"); clearTimeout(reasonTimer);
  reasonTimer=setTimeout(function(){ var r=document.getElementById("skipWhy"); if(r) r.classList.add("fade"); },5000);
}
function back(){
  var k=S.league, sk=S.skips[k]||[]; if(!sk.length) return;
  snap(); var prev=sk[sk.length-1]; S.skips[k]=sk.slice(0,-1); S.deck[k]=prev; S._cardIn=true;
  log("deck_back","Back to move "+(prev+1)); render();
}
function doIt(){
  var card=document.getElementById("movecard"), k=S.league, i=deckIdx(), m=curMove();
  var go=function(){ snap(); S.chosen[k]=i; S._cardIn=true; log("do_it","Picked "+m.partner+" ("+m.get.join(" + ")+"). You send it in ESPN.");
    render(); toast("Picked. Copy the message, then send it yourself in ESPN."); };
  if(card && isBig("next")){ card.classList.add("out-right"); setTimeout(go,200); } else go();
}
function bindSwipe(){
  var card=document.getElementById("movecard"); if(!card) return;
  var x0=null,y0=null,dx=0;
  card.addEventListener("touchstart",function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; e.stopPropagation(); },{passive:true});
  card.addEventListener("touchmove",function(e){ if(x0==null) return; dx=e.touches[0].clientX-x0; var dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)){ card.style.transition="none"; card.style.transform="translateX("+dx+"px) rotate("+(dx/40)+"deg)"; } e.stopPropagation(); },{passive:true});
  card.addEventListener("touchend",function(e){ card.style.transition=""; card.style.transform=""; e.stopPropagation();
    if(dx<-70) skip(); else if(dx>70) doIt(); x0=null; });
}

/* ================= events ================= */
var toastEl=document.getElementById("toast");
function toast(s){ toastEl.textContent=s; toastEl.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){ toastEl.classList.remove("on"); },2200); }
function afterRender(){
  if(isPhone()){
    if(S._goto){ gotoPanel(S._goto); }
    var coach=document.getElementById("coach");
    if(!pending) coach.classList.remove("open"); else coach.classList.add("open");
  }
  S._goto=null;
}
function gotoPanel(p){
  var deck=document.getElementById("deck"), el=document.querySelector('.panel[data-p="'+p+'"]');
  if(el && isPhone()) deck.scrollTo({left:el.offsetLeft-deck.offsetLeft, behavior:"smooth"});
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act],[data-say]"); if(!b) return;
  if(b.hasAttribute("data-say")){ run(b.getAttribute("data-say")); return; }
  var act=b.getAttribute("data-act"), v=b.getAttribute("data-v"), p=b.getAttribute("data-p");
  switch(act){
    case "league": S.league=+b.getAttribute("data-l"); S.page={}; render(); break;
    case "expand": S.swap=p; S.bigPanel = S.bigPanel===p ? null : S.bigPanel; log("expand",PANEL_NAMES[p]+" into the big slot (Esc restores)"); render(); break;
    case "restore": S.swap=null; render(); break;
    case "pg": S.page[p]=(S.page[p]||0)+(+b.getAttribute("data-d")); render(); break;
    case "theme": var dark=document.documentElement.getAttribute("data-theme")==="dark"; document.documentElement.setAttribute("data-theme",dark?"light":"dark"); render(); break;
    case "risk": var nx={safe:"balanced",balanced:"all_in",all_in:"safe"}[planOf(S.league).risk]; openCoach(); apply({type:"set_risk_mode",to:nx,until:null},""); break;
    case "copy":
      var txt=(document.getElementById("msgText")||{}).textContent || curMove().msg;
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast("Copied. Paste it to "+curMove().partner+" in ESPN."); },function(){ toast("Copy blocked here. Select the text instead."); });
      else toast("Copy blocked here. Select the text instead.");
      log("copy","Message copied (you send it)"); break;
    case "skip": skip(); break;
    case "back": back(); break;
    case "deckreset": snap(); S.deck[S.league]=0; S.skips[S.league]=[]; render(); break;
    case "doit": doIt(); break;
    case "skipreason": log("skip_reason","\""+v+"\" on "+b.getAttribute("data-m")+" (teaches the brain what you like)"); var r=document.getElementById("skipWhy"); if(r){ r.innerHTML='<span class="grey">Got it: "'+esc(v)+'". Noted for the brain.</span>'; setTimeout(function(){ var q=document.getElementById("skipWhy"); if(q) q.classList.add("fade"); },1500); } break;
    case "reply": S.reply[S.league] = S.reply[S.league]===b.getAttribute("data-r") ? null : b.getAttribute("data-r"); render(); break;
    case "declreason": log("decline_reason","\""+v+"\" logged for "+curMove().partner); toast("Logged: "+v+". The planner re-ranks the deck."); S.reply[S.league]=null; render(); break;
    case "clearfilter": snap(); S.filter=null; log("filter","Filter cleared (you)"); render(); break;
    case "pin": run("pin "+v); break;
    case "unpin": snap(); S.pins=S.pins.filter(function(x){ return x!==v; }); log("unpin","Unpinned "+v); render(); break;
    case "uncard": snap(); S.cards=S.cards.filter(function(c){ return c.id!==v; }); log("remove_card","Removed a Coach card"); render(); break;
    case "approve": snap(); ensurePlan(S.league).approved=v; log("approve","Approved target "+v+" (planner re-routes)"); toast("Approved "+v+". The planner re-routes (preview)."); render(); break;
    case "say": openCoach(); var inp=document.getElementById("askIn"); inp.value=v; inp.focus(); break;
    case "confirm": confirmPending(); break;
    case "cancel": cancelPending(); break;
    case "goto": gotoPanel(p); break;
  }
});
function openCoach(){ document.getElementById("coach").classList.add("open"); }
document.getElementById("coachHead").addEventListener("click",function(){ if(isPhone()) document.getElementById("coach").classList.toggle("open"); });
document.getElementById("ask").addEventListener("submit",function(e){ e.preventDefault(); var i=document.getElementById("askIn"); var v=i.value; i.value=""; run(v); });
document.addEventListener("keydown",function(e){
  var typing=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"");
  if(e.key==="Escape"){ if(pending){ cancelPending(); return; } if(S.swap){ S.swap=null; log("restore","Esc: next move back in the big slot"); render(); } if(typing) document.activeElement.blur(); return; }
  if(typing) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); skip(); }
  if(e.key==="ArrowRight"){ e.preventDefault(); doIt(); }
});
document.getElementById("deck").addEventListener("scroll",function(){
  var d=this, w=d.clientWidth||1, i=Math.round(d.scrollLeft/(w+8));
  if(i!==S._deckPos){ S._deckPos=i; renderDots(); }
},{passive:true});
var wasPhone=isPhone();
window.addEventListener("resize",function(){ if(isPhone()!==wasPhone){ wasPhone=isPhone(); render(); } });

/* initial theme from the system; the toggle overrides */
try{ document.documentElement.setAttribute("data-theme", window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }catch(err){}
render();
say("c","I run this screen. Ask me to show, filter, pin, add a card, resize, or change the plan. Plan changes always show a trade-off first. I never send offers.","hello");
})();
</script>
</body>
</html>
