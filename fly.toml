# app name is set by `fly launch` / `fly apps create` — leave blank here and
# pass --name, or let `fly launch` fill it in on first run.
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  # The scheduler fix from tonight (nfl_prop_feeds/beat_the_close off the
  # live tier) is what makes always-on hosting practical; leave it enabled.
  #
  # Which NFL season this deployment is playing. It was unset, and 79 sites
  # read it as `Number(process.env.NFL_SEASON) || <fallback>` in two different
  # fallbacks: some hard-code 2026, the rest use the calendar year. Unset, both
  # give 2026 during the 2026 calendar year, so nothing is visibly wrong today
  # -- and on 2027-01-01, mid-playoffs, the calendar-year sites silently become
  # 2027 while the hard-coded ones stay 2026, splitting the app's idea of the
  # season in half. Setting it here makes every site agree.
  #
  # BUMP THIS EACH SEPTEMBER. That is the cost of pinning it, and it is the
  # cheaper of the two failures: a stale pin is one wrong number everywhere,
  # which shows up immediately, rather than two right-looking numbers that
  # disagree.
  NFL_SEASON = "2026"

[[mounts]]
  source = "gridiron_data"
  destination = "/data"

[[services]]
  internal_port = 5177
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # An HTTP check, NOT a TCP one.
  #
  # This was `[[services.tcp_checks]]`, and that is why a wedged app stayed
  # wedged. A TCP check is satisfied by the kernel accepting a connection onto
  # the listen backlog, which happens whether or not Node's event loop is
  # turning — so when the heavy scheduler tier blocked the loop (see
  # runJobOffThread in server/services/scheduler.js), Fly saw a healthy machine,
  # kept routing to it, and never restarted it. The app answered nothing for as
  # long as the block lasted and nothing on the platform noticed.
  #
  # `/api/health` executes JavaScript and makes a synchronous SQLite call, so
  # this check fails exactly when the app cannot serve a request. It is
  # unauthenticated because a health check cannot carry a bearer token.
  #
  # timeout 5s: generous enough to ride out a brief main-thread pause without
  # bouncing the machine, short enough that a real wedge is caught within a
  # couple of intervals. grace_period 60s: boot runs migrations and seed
  # reconciliation against the volume before `app.listen`, and a restart loop
  # caused by an impatient check would be worse than the bug being fixed.
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "get"
    path = "/api/health"
    protocol = "http"
