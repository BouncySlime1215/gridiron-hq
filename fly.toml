# app name is set by `fly launch` / `fly apps create` — leave blank here and
# pass --name, or let `fly launch` fill it in on first run.
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  # The scheduler fix from tonight (nfl_prop_feeds/beat_the_close off the
  # live tier) is what makes always-on hosting practical; leave it enabled.

[[mounts]]
  source = "gridiron_data"
  destination = "/data"

[[services]]
  internal_port = 5177
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

  # A TCP check is satisfied by the kernel's listen backlog: the socket accepts
  # even when the Node process is wedged and never calls accept(), so a blocked
  # event loop kept passing while every request hung with no reply. This check
  # goes through the event loop, so a wedged process shows as unhealthy instead
  # of quietly swallowing traffic. /api/health does no database work, and the
  # grace period covers migrations plus the boot warm-up.
  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    method = "get"
    path = "/api/health"
    protocol = "http"
